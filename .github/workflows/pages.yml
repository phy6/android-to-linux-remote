name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Build
        env:
          # Project Pages are served from /<repo>/ — override to "/" for a custom domain.
          BASE_PATH: /${{ github.event.repository.name }}/
          GITHUB_SHA: ${{ github.sha }}
        run: bun run build

      - name: Build the laptop web app bundle
        env:
          # install.sh serves this from the laptop root, so it must not carry
          # the /<repo>/ base path the Pages copy is built with.
          BASE_PATH: /
          GITHUB_SHA: ${{ github.sha }}
        run: |
          bun run build -- --outDir dist-webroot --emptyOutDir
          rm -f dist-webroot/version.json
          tar czf dist/taildeck-web.tar.gz -C dist-webroot .

      - name: Stamp the release manifest with the bundle checksum
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          WEB_SHA=$(sha256sum dist/taildeck-web.tar.gz | cut -d' ' -f1)
          python3 - "$WEB_SHA" "${{ github.sha }}" <<'PY'
          import json, sys
          sha = sys.argv[1]
          gitsha = sys.argv[2][:7]
          p = 'dist/version.json'
          d = json.load(open(p))
          d['appSha'] = gitsha
          d.setdefault('files', {})['web'] = sha
          with open(p, 'w') as fh:
              json.dump(d, fh, indent=2)
              fh.write('\n')
          print(open(p).read())
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4